const STORAGE_KEY = "thompson-gains-v3";

function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; } catch(e) { return {}; }
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {} }

// ---- SWAP EXERCISE MODAL ----
function SwapExerciseModal({ exercise, color, customLibrary, onSave, onClose }) {
  const [activeGroup, setActiveGroup] = useState(Object.keys(EXERCISE_LIBRARY)[0]);
  const [customInput, setCustomInput] = useState("");
  const [customReps, setCustomReps] = useState(exercise.reps || "10–12");
  const [saveToLib, setSaveToLib] = useState(true);
  const [tab, setTab] = useState("library"); // "library" | "custom"

  const allCustom = customLibrary || {};
  const customList = allCustom[activeGroup] || [];

  const handlePick = (name) => {
    onSave({ name, reps: exercise.reps }, null);
  };

  const handleCustomSubmit = () => {
    if (!customInput.trim()) return;
    const newEx = { name: customInput.trim(), reps: customReps };
    const newLib = saveToLib
      ? { ...allCustom, [activeGroup]: [...(allCustom[activeGroup] || []), customInput.trim()] }
      : allCustom;
    onSave(newEx, saveToLib ? newLib : null);
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.9)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center", padding: 0 }}>
      <div style={{ background: "#141414", border: `1px solid ${color}44`, borderRadius: "16px 16px 0 0", width: "100%", maxWidth: 700, maxHeight: "85vh", display: "flex", flexDirection: "column", animation: "fadeIn 0.2s ease" }}>

        {/* Modal Header */}
        <div style={{ padding: "18px 20px 14px", borderBottom: "1px solid #222", flexShrink: 0 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, color, letterSpacing: 2 }}>SWAP EXERCISE</div>
              <div style={{ fontSize: 12, color: "#555", marginTop: 2 }}>Replacing: <span style={{ color: "#aaa" }}>{exercise.name}</span></div>
            </div>
            <button onClick={onClose} style={{ background: "transparent", border: "1px solid #333", color: "#666", padding: "6px 12px", borderRadius: 6, cursor: "pointer", fontFamily: "inherit", fontSize: 12 }}>✕ CLOSE</button>
          </div>

          {/* Tabs */}
          <div style={{ display: "flex", gap: 6, marginTop: 14 }}>
            {["library", "custom"].map(t => (
              <button key={t} onClick={() => setTab(t)} style={{
                padding: "7px 16px", borderRadius: 6, cursor: "pointer", fontFamily: "inherit",
                fontWeight: 600, fontSize: 12, letterSpacing: 1, textTransform: "uppercase",
                background: tab === t ? color : "transparent",
                border: `1px solid ${tab === t ? color : "#333"}`,
                color: tab === t ? "#000" : "#666",
                transition: "all 0.15s",
              }}>
                {t === "library" ? "📋 Exercise Library" : "✏️ Write My Own"}
              </button>
            ))}
          </div>
        </div>

        {tab === "library" ? (
          <div style={{ display: "flex", flex: 1, overflow: "hidden" }}>
            {/* Muscle Group Sidebar */}
            <div style={{ width: 110, borderRight: "1px solid #1e1e1e", overflowY: "auto", flexShrink: 0 }}>
              {Object.keys(EXERCISE_LIBRARY).map(group => (
                <button key={group} onClick={() => setActiveGroup(group)} style={{
                  width: "100%", padding: "10px 10px", textAlign: "left", background: activeGroup === group ? `${color}18` : "transparent",
                  border: "none", borderLeft: activeGroup === group ? `3px solid ${color}` : "3px solid transparent",
                  color: activeGroup === group ? color : "#666", cursor: "pointer", fontSize: 11,
                  fontFamily: "inherit", fontWeight: activeGroup === group ? 600 : 400,
                  transition: "all 0.15s", lineHeight: 1.3,
                }}>
                  {group}
                </button>
              ))}
            </div>

            {/* Exercise List */}
            <div style={{ flex: 1, overflowY: "auto", padding: "8px 0" }}>
              {/* Custom saved exercises for this group */}

                <>
                  <div style={{ padding: "6px 16px", fontSize: 10, color: "#e8ff47", textTransform: "uppercase", letterSpacing: 2, fontWeight: 700 }}>⭐ MY SAVED</div>
                  {customList.map((name, i) => (
                    <button key={i} onClick={() => handlePick(name)} style={{
                      width: "100%", padding: "11px 16px", textAlign: "left", background: "transparent",
                      border: "none", borderBottom: "1px solid #1a1a1a", color: "#e8ff47",
                      cursor: "pointer", fontSize: 13, fontFamily: "inherit", transition: "background 0.1s",
                    }}
                    onMouseOver={e => e.currentTarget.style.background = "#1a1a1a"}
                    onMouseOut={e => e.currentTarget.style.background = "transparent"}>
                      {name}
                    </button>
                  ))}
                  <div style={{ height: 1, background: "#222", margin: "4px 0" }} />
                </>
              )}
              {/* Default library */}

// ---- REST TIMER ----
function RestTimer({ color }) {
  const [seconds, setSeconds] = useState(60);
  const [timeLeft, setTimeLeft] = useState(null);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const intervalRef = useRef(null);

  useEffect(() => {
    if (running && timeLeft > 0) {
      intervalRef.current = setInterval(() => setTimeLeft(t => t - 1), 1000);
    } else if (running && timeLeft === 0) {
      setRunning(false);
      setDone(true);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, timeLeft]);

  const start = () => { setTimeLeft(seconds); setRunning(true); setDone(false); };
  const stop = () => { setRunning(false); clearInterval(intervalRef.current); };
  const reset = () => { stop(); setTimeLeft(null); setDone(false); };

  const pct = timeLeft !== null ? (timeLeft / seconds) * 100 : 100;
  const radius = 28; const circ = 2 * Math.PI * radius;

  return (
    <div style={{ background: "#111", border: `1px solid ${running ? color : "#222"}`, borderRadius: 12, padding: "14px 16px", marginBottom: 12, transition: "border-color 0.3s" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
        <div style={{ position: "relative", width: 70, height: 70, flexShrink: 0 }}>
          <svg width="70" height="70" style={{ transform: "rotate(-90deg)" }}>
            <circle cx="35" cy="35" r={radius} fill="none" stroke="#222" strokeWidth="5"/>
            <circle cx="35" cy="35" r={radius} fill="none" stroke={done ? "#47ffb0" : color}
              strokeWidth="5" strokeDasharray={circ}
              strokeDashoffset={circ * (1 - pct/100)}
              style={{ transition: "stroke-dashoffset 0.9s linear", strokeLinecap: "round" }}
            />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center",
            fontFamily: "'Bebas Neue', sans-serif", fontSize: 18, color: done ? "#47ffb0" : timeLeft !== null ? color : "#666",
            animation: done ? "ring 0.5s ease" : "none"
          }}>
            {done ? "GO!" : timeLeft !== null ? timeLeft : "REST"}
          </div>
        </div>

        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 11, color: "#555", textTransform: "uppercase", letterSpacing: 2, marginBottom: 8 }}>REST TIMER</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}>
            {[30,45,60,90,120].map(s => (
              <button key={s} onClick={() => { setSeconds(s); setTimeLeft(null); setRunning(false); setDone(false); }} style={{
                padding: "4px 10px", borderRadius: 5, border: `1px solid ${seconds === s && !running ? color : "#2a2a2a"}`,
                background: seconds === s && !running ? `${color}22` : "transparent",
                color: seconds === s && !running ? color : "#666", fontSize: 12, cursor: "pointer", fontFamily: "inherit",
              }}>{s}s</button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            {!running && timeLeft === null && (
              <button onClick={start} style={{ padding: "7px 18px", borderRadius: 6, background: color, border: "none", color: "#000", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1 }}>START</button>
            )}
            {running && (
              <button onClick={stop} style={{ padding: "7px 18px", borderRadius: 6, background: "#222", border: `1px solid #444`, color: "#aaa", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>PAUSE</button>
            )}
            {!running && timeLeft !== null && timeLeft > 0 && (
              <button onClick={start} style={{ padding: "7px 18px", borderRadius: 6, background: color, border: "none", color: "#000", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>RESUME</button>
            )}
            {timeLeft !== null && (
              <button onClick={reset} style={{ padding: "7px 14px", borderRadius: 6, background: "transparent", border: "1px solid #2a2a2a", color: "#555", fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>RESET</button>
            )}
            {done && (
              <button onClick={() => { start(); }} style={{ padding: "7px 18px", borderRadius: 6, background: "#47ffb0", border: "none", color: "#000", fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>AGAIN</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// ---- WORKOUT TIMER ----
function WorkoutTimer({ color, isRunning, onToggle, onReset }) {
  const [elapsed, setElapsed] = useState(0);
  const intervalRef = useRef(null);
  const startRef = useRef(null);

  useEffect(() => {
    if (isRunning) {
      startRef.current = Date.now() - elapsed * 1000;
      intervalRef.current = setInterval(() => {
        setElapsed(Math.floor((Date.now() - startRef.current) / 1000));
      }, 500);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [isRunning]);

  const handleReset = () => { setElapsed(0); onReset(); };
  const mins = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const secs = String(elapsed % 60).padStart(2, "0");
  const overTime = elapsed > 1800;

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
      <div style={{
        fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, letterSpacing: 2,
        color: overTime ? "#ff4444" : isRunning ? color : "#555",
        animation: isRunning ? "timerPulse 2s ease infinite" : "none",
        minWidth: 90, textAlign: "center",
      }}>
        {mins}:{secs}
      </div>
      <button onClick={onToggle} style={{
        padding: "6px 14px", borderRadius: 6, border: `1px solid ${isRunning ? "#444" : color}`,
        background: isRunning ? "#1a1a1a" : `${color}22`, color: isRunning ? "#888" : color,
        fontFamily: "inherit", fontWeight: 600, fontSize: 11, cursor: "pointer", letterSpacing: 1,
      }}>
        {isRunning ? "⏸ PAUSE" : "▶ START"}
      </button>
      <button onClick={handleReset} style={{
        padding: "6px 10px", borderRadius: 6, border: "1px solid #2a2a2a",
        background: "transparent", color: "#555", fontFamily: "inherit", fontSize: 11, cursor: "pointer",
      }}>↺</button>
      {overTime && <span style={{ fontSize: 10, color: "#ff4444", letterSpacing: 1 }}>OVER 30 MIN</span>}
    </div>
  );
}

// ---- STATS DASHBOARD ----
function StatsDashboard({ data, history, onClose }) {
  const [tab, setTab] = useState("overview");
  const [bodyWeightInput, setBodyWeightInput] = useState("");

  // Streak calc
  const calcStreak = () => {
    if (!history.length) return { current: 0, best: 0 };
    const dates = [...new Set(history.map(h => h.date))].sort((a,b) => new Date(b) - new Date(a));
    let current = 0, best = 0, streak = 1;
    for (let i = 0; i < dates.length - 1; i++) {
      const diff = (new Date(dates[i]) - new Date(dates[i+1])) / 86400000;
      if (diff <= 2) { streak++; } else { best = Math.max(best, streak); streak = 1; }
    }
    best = Math.max(best, streak);
    // current streak from today
    const today = new Date();
    const lastDate = new Date(dates[0]);
    const daysSince = Math.floor((today - lastDate) / 86400000);
    current = daysSince <= 1 ? streak : 0;
    return { current, best };
  };

  // Weekly volume
  const getWeeklyVolume = () => {
    const weeks = {};
    history.forEach(h => {
      const d = new Date(h.date);
      const weekStart = new Date(d);
      weekStart.setDate(d.getDate() - d.getDay());
      const key = weekStart.toLocaleDateString();
      weeks[key] = (weeks[key] || 0) + (h.totalVolume || 0);
    });
    return Object.entries(weeks).slice(-8).map(([week, vol]) => ({ week, vol }));
  };

  // PR tracker
  const getPRs = () => {
    const prs = {};
    [...history].reverse().forEach(session => {
      session.exercises?.forEach(ex => {
        if (!ex.bodyweight) {
          const maxWeight = Math.max(...(ex.sets||[]).map(s => parseFloat(s.weight)||0));
          if (maxWeight > 0 && (!prs[ex.name] || maxWeight > prs[ex.name].weight)) {
            prs[ex.name] = { weight: maxWeight, date: session.date };
          }
        }
      });
    });
    return Object.entries(prs).sort((a,b) => b[1].weight - a[1].weight);
  };

  // Muscle heat map — last 7 days
  const getMuscleFrequency = () => {
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    const freq = {};
    ALL_MUSCLES.forEach(m => freq[m] = 0);
    history.filter(h => new Date(h.date) >= weekAgo).forEach(h => {
      const wo = WORKOUTS.find(w => w.label === h.label);
      if (wo) (MUSCLE_GROUPS[wo.id] || []).forEach(m => { freq[m] = (freq[m]||0) + 1; });
    });
    return freq;
  };

  // Deload check — 4+ workouts in 7 days
  const checkDeload = () => {
    const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
    return history.filter(h => new Date(h.date) >= weekAgo).length >= 4;
  };

  // Body weight
  const bodyWeights = data.bodyWeights || [];
  const addBodyWeight = () => {
    if (!bodyWeightInput) return;
    const entry = { date: new Date().toLocaleDateString(), weight: parseFloat(bodyWeightInput) };
    const newWeights = [entry, ...bodyWeights].slice(0, 52);
    saveData({ ...data, bodyWeights: newWeights });
    setBodyWeightInput("");
  };

  // Auto progression suggestions
  const getProgressionSuggestions = () => {
    const suggestions = [];
    if (history.length < 2) return suggestions;
    const lastSession = history[0];
    const prevSession = history.slice(1).find(h => h.label === lastSession.label);
    if (!prevSession) return suggestions;
    lastSession.exercises?.forEach(ex => {
      if (ex.bodyweight) return;
      const lastSets = ex.sets?.filter(s => s.done && parseFloat(s.weight) > 0) || [];
      const prevEx = prevSession.exercises?.find(e => e.name === ex.name);
      const prevSets = prevEx?.sets?.filter(s => s.done && parseFloat(s.weight) > 0) || [];
      if (!lastSets.length || !prevSets.length) return;
      const lastMax = Math.max(...lastSets.map(s => parseFloat(s.weight)));
      const prevMax = Math.max(...prevSets.map(s => parseFloat(s.weight)));
      const lastCompleted = ex.setsCompleted >= ex.totalSets;
      if (lastCompleted && lastMax >= prevMax) {
        suggestions.push({ name: ex.name, current: lastMax, suggested: lastMax + 5 });
      }
    });
    return suggestions.slice(0, 6);
  };

  const { current: streakCurrent, best: streakBest } = calcStreak();
  const weeklyVol = getWeeklyVolume();
  const prs = getPRs();
  const muscleFreq = getMuscleFrequency();
  const needsDeload = checkDeload();
  const suggestions = getProgressionSuggestions();
  const maxVol = Math.max(...weeklyVol.map(w => w.vol), 1);

  const exportPDF = () => {
    const rows = history.slice(0, 20).map(h => `
      <tr><td>${h.date}</td><td>${h.label}</td><td>${h.setsCompleted}/${h.totalSets}</td><td>${(h.totalVolume||0).toLocaleString()} lbs</td></tr>
      ${(h.exercises||[]).filter(e=>e.setsCompleted>0).map(e=>`
        <tr style="background:#f9f9f9"><td colspan="2" style="padding-left:20px;font-size:12px">${e.name}</td><td style="font-size:12px">${e.setsCompleted}/${e.totalSets} sets</td><td style="font-size:12px">${e.bodyweight ? '' : (e.volume||0)+' lbs'}</td></tr>
        ${(e.sets||[]).filter(s=>s.weight).map(s=>`<tr><td colspan="2" style="padding-left:36px;font-size:11px;color:#888">Set ${s.setNum}</td><td colspan="2" style="font-size:11px;color:#888">${s.weight} ${e.bodyweight?'reps':'lbs'}</td></tr>`).join('')}
      `).join('')}
    `).join('');
    const html = `<!DOCTYPE html><html><head><title>Thompson Gains — Workout History</title><style>body{font-family:sans-serif;padding:20px;color:#222}h1{color:#111;border-bottom:2px solid #222;padding-bottom:8px}table{width:100%;border-collapse:collapse;margin-top:20px}th{background:#222;color:#fff;padding:8px 12px;text-align:left}td{padding:8px 12px;border-bottom:1px solid #eee}</style></head><body><h1>Thompson Gains — Workout History</h1><p>Exported: ${new Date().toLocaleDateString()}</p><table><thead><tr><th>Date</th><th>Workout</th><th>Sets</th><th>Volume</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);

      <div style={{ maxWidth:700, margin:"0 auto", padding:"20px 16px 80px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
          <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:32, color:"#e8ff47", letterSpacing:3 }}>STATS & TOOLS</div>
          <button onClick={onClose} style={{ background:"transparent", border:"1px solid #333", color:"#888", padding:"8px 14px", borderRadius:6, cursor:"pointer", fontFamily:"inherit", fontSize:12 }}>← BACK</button>
        </div>

        {/* Tabs */}
        <div style={{ display:"flex", gap:4, overflowX:"auto", marginBottom:20, paddingBottom:4 }}>
          {TABS.map(t => (
            <button key={t} onClick={() => setTab(t)} style={{
              padding:"7px 12px", borderRadius:6, cursor:"pointer", fontFamily:"inherit",
              fontWeight:600, fontSize:11, letterSpacing:1, textTransform:"uppercase", whiteSpace:"nowrap",
              background: tab===t ? "#e8ff47" : "#1a1a1a",
              border: `1px solid ${tab===t ? "#e8ff47" : "#2a2a2a"}`,
              color: tab===t ? "#000" : "#666",
            }}>{t}</button>
          ))}
        </div>

        {/* OVERVIEW */}
        {tab==="overview" && (
          <div style={{ animation:"fadeIn 0.2s ease" }}>
            {needsDeload && (
              <div style={{ background:"rgba(255,107,53,0.1)", border:"1px solid rgba(255,107,53,0.4)", borderRadius:10, padding:16, marginBottom:16, display:"flex", gap:12, alignItems:"center" }}>
                <span style={{ fontSize:28 }}>⚠️</span>
                <div>
                  <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:18, color:"#ff6b35", letterSpacing:2 }}>DELOAD WEEK RECOMMENDED</div>
                  <div style={{ fontSize:12, color:"#888", marginTop:2 }}>You've hit 4+ sessions this week. Consider a deload — lighter weights, protect the knee, let your body recover.</div>
                </div>
              </div>
            )}
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12, marginBottom:16 }}>
              {[
                { label:"Current Streak", value:`${streakCurrent} days`, icon:"🔥" },
                { label:"Best Streak", value:`${streakBest} days`, icon:"🏆" },
                { label:"Total Workouts", value:history.length, icon:"💪" },
                { label:"PRs Logged", value:prs.length, icon:"⭐" },
              ].map((stat,i) => (
                <div key={i} style={{ background:"#141414", border:"1px solid #222", borderRadius:10, padding:16 }}>
                  <div style={{ fontSize:24, marginBottom:4 }}>{stat.icon}</div>
                  <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:28, color:"#e8ff47", letterSpacing:1 }}>{stat.value}</div>
                  <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:1 }}>{stat.label}</div>
                </div>
              ))}
            </div>
            <button onClick={exportPDF} style={{ width:"100%", padding:"12px 0", borderRadius:8, background:"#1a1a1a", border:"1px solid #333", color:"#aaa", fontFamily:"inherit", fontWeight:600, fontSize:13, cursor:"pointer", letterSpacing:1 }}>
              📄 EXPORT HISTORY TO HTML FILE
            </button>
          </div>
        )}

        {/* PRs */}
        {tab==="prs" && (
          <div style={{ animation:"fadeIn 0.2s ease" }}>
            <div style={{ fontSize:12, color:"#555", marginBottom:16 }}>Your heaviest logged weight per exercise across all sessions.</div>
            {prs.length === 0 ? (
              <div style={{ textAlign:"center", color:"#444", padding:40 }}>No PRs yet — log some weights to start tracking!</div>
            ) : prs.map(([name, pr], i) => (
              <div key={i} style={{ background:"#141414", border:"1px solid #222", borderRadius:8, padding:"12px 16px", marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <div>
                  <div style={{ fontSize:13, fontWeight:500, color:"#e0e0e0" }}>{name}</div>
                  <div style={{ fontSize:11, color:"#555", marginTop:2 }}>{pr.date}</div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                  <span style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:22, color:"#e8ff47" }}>{pr.weight} lbs</span>
                  {i === 0 && <span style={{ fontSize:18 }}>🏆</span>}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* VOLUME CHART */}
        {tab==="volume" && (
          <div style={{ animation:"fadeIn 0.2s ease" }}>
            <div style={{ fontSize:12, color:"#555", marginBottom:16 }}>Total weight lifted per week (last 8 weeks)</div>
            {weeklyVol.length === 0 ? (
              <div style={{ textAlign:"center", color:"#444", padding:40 }}>No data yet — complete some workouts!</div>
            ) : (
              <div style={{ background:"#141414", border:"1px solid #222", borderRadius:10, padding:20 }}>
                <div style={{ display:"flex", alignItems:"flex-end", gap:8, height:160 }}>
                  {weeklyVol.map((w,i) => (
                    <div key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
                      <div style={{ fontSize:9, color:"#555", textAlign:"center" }}>{w.vol.toLocaleString()}</div>
                      <div style={{ width:"100%", background:"#e8ff47", borderRadius:"3px 3px 0 0", height:`${Math.max((w.vol/maxVol)*120, 4)}px`, transition:"height 0.4s ease" }} />
                      <div style={{ fontSize:8, color:"#444", textAlign:"center", writingMode:"vertical-rl", transform:"rotate(180deg)", height:40 }}>{w.week.split("/").slice(0,2).join("/")}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {/* MUSCLE HEAT MAP */}
        {tab==="muscles" && (
          <div style={{ animation:"fadeIn 0.2s ease" }}>
            <div style={{ fontSize:12, color:"#555", marginBottom:16 }}>Muscle groups trained in the last 7 days</div>
            {ALL_MUSCLES.map(muscle => {
              const freq = muscleFreq[muscle] || 0;
              const maxFreq = Math.max(...Object.values(muscleFreq), 1);
              const intensity = freq / maxFreq;
              const bg = freq === 0 ? "#1a1a1a" : `rgba(232,255,71,${0.15 + intensity * 0.7})`;
              const textColor = freq === 0 ? "#444" : intensity > 0.5 ? "#000" : "#e8ff47";
              return (
                <div key={muscle} style={{ display:"flex", alignItems:"center", gap:12, marginBottom:8 }}>
                  <div style={{ width:120, fontSize:12, color:"#888" }}>{muscle}</div>
                  <div style={{ flex:1, background:"#1a1a1a", borderRadius:4, height:28, overflow:"hidden" }}>
                    <div style={{ width:`${Math.max(freq/maxFreq*100,0)}%`, height:"100%", background: freq===0?"transparent":"#e8ff47", opacity: 0.2+intensity*0.8, transition:"width 0.4s ease", minWidth: freq>0?8:0, borderRadius:4 }} />
                  </div>
                  <div style={{ fontSize:12, color: freq===0?"#333":"#e8ff47", fontWeight:600, width:20, textAlign:"right" }}>{freq>0?freq:"–"}</div>
                </div>
              );
            })}
            <div style={{ fontSize:11, color:"#444", marginTop:12 }}>Number = sessions this week targeting that muscle</div>
          </div>
        )}

        {/* BODY WEIGHT */}
        {tab==="bodyweight" && (
          <div style={{ animation:"fadeIn 0.2s ease" }}>
            <div style={{ background:"#141414", border:"1px solid #222", borderRadius:10, padding:16, marginBottom:16 }}>
              <div style={{ fontSize:11, color:"#555", textTransform:"uppercase", letterSpacing:2, marginBottom:10 }}>LOG TODAY'S WEIGHT</div>
              <div style={{ display:"flex", gap:8 }}>
                <input type="number" value={bodyWeightInput} onChange={e => setBodyWeightInput(e.target.value)} placeholder="e.g. 185"
                  style={{ flex:1, padding:"10px 14px", background:"#1a1a1a", border:"1px solid #333", borderRadius:8, color:"#fff", fontSize:15, fontFamily:"inherit", outline:"none" }} />
                <span style={{ alignSelf:"center", color:"#555", fontSize:13 }}>lbs</span>
                <button onClick={addBodyWeight} style={{ padding:"10px 20px", borderRadius:8, background:"#e8ff47", border:"none", color:"#000", fontFamily:"inherit", fontWeight:700, cursor:"pointer", fontSize:13 }}>LOG</button>
              </div>
            </div>
            {bodyWeights.length === 0 ? (
              <div style={{ textAlign:"center", color:"#444", padding:40 }}>No weight logged yet. Start tracking above!</div>
            ) : bodyWeights.map((bw, i) => {
              const prev = bodyWeights[i+1];
              const diff = prev ? (bw.weight - prev.weight).toFixed(1) : null;
              const up = diff > 0; const down = diff < 0;
              return (
                <div key={i} style={{ background:"#141414", border:"1px solid #1e1e1e", borderRadius:8, padding:"12px 16px", marginBottom:8, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div style={{ fontSize:12, color:"#555" }}>{bw.date}</div>
                  <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                    {diff !== null && (
                      <span style={{ fontSize:11, color: up?"#ff6666":down?"#47ffb0":"#888", fontWeight:600 }}>
                        {up?"+":""}{diff} lbs
                      </span>
                    )}
                    <span style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:22, color:"#e8ff47" }}>{bw.weight} lbs</span>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* AUTO PROGRESSION */}
        {tab==="suggestions" && (
          <div style={{ animation:"fadeIn 0.2s ease" }}>
            <div style={{ fontSize:12, color:"#555", marginBottom:16 }}>Based on your last session — exercises where you completed all sets are suggested for +5 lbs next time.</div>
            {suggestions.length === 0 ? (
              <div style={{ textAlign:"center", color:"#444", padding:40 }}>Complete a full workout to get progression suggestions!</div>
            ) : suggestions.map((s,i) => (
              <div key={i} style={{ background:"#141414", border:"1px solid #222", borderRadius:8, padding:"14px 16px", marginBottom:8 }}>
                <div style={{ fontSize:13, fontWeight:500, color:"#e0e0e0", marginBottom:6 }}>{s.name}</div>
                <div style={{ display:"flex", gap:16, alignItems:"center" }}>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:10, color:"#555", textTransform:"uppercase", letterSpacing:1 }}>Last</div>
                    <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:22, color:"#888" }}>{s.current} lbs</div>
                  </div>
                  <div style={{ fontSize:20, color:"#555" }}>→</div>
                  <div style={{ textAlign:"center" }}>
                    <div style={{ fontSize:10, color:"#47ffb0", textTransform:"uppercase", letterSpacing:1 }}>Try</div>
                    <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:22, color:"#47ffb0" }}>{s.suggested} lbs</div>
                  </div>
                  <div style={{ marginLeft:"auto", fontSize:18 }}>💪</div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

// ---- MAIN APP ----
function App() {
  const [data, setData] = useState(() => loadData());
  const [activeDay, setActiveDay] = useState(() => WEEKDAYS[new Date().getDay()]);
  const [showScheduleEditor, setShowScheduleEditor] = useState(false);
  const [historyView, setHistoryView] = useState(false);
  const [showComplete, setShowComplete] = useState(false);
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerKey, setTimerKey] = useState(0);
  const [swapTarget, setSwapTarget] = useState(null);
  const [showWarmUp, setShowWarmUp] = useState(false);
  const [showStats, setShowStats] = useState(false);

  const schedule = data.schedule || DEFAULT_SCHEDULE;
  const workoutId = schedule[activeDay] || "rest";
  const currentWorkout = WORKOUTS.find(w => w.id === workoutId) || WORKOUTS[5];
  const history = data.history || [];

  const update = (newData) => { setData(newData); saveData(newData); };

  const toggleSet = (exId, si) => {
    const key = `${activeDay}-${workoutId}-${exId}-s${si}`;
    const logs = { ...(data.logs || {}), [key]: !data.logs?.[key] };
    update({ ...data, logs });
  };
  const setWeight = (exId, setIdx, val) => {
    const key = `${activeDay}-${workoutId}-${exId}-w${setIdx}`;
    update({ ...data, weights: { ...(data.weights || {}), [key]: val } });
  };
  const setNote = (exId, val) => {
    const key = `${activeDay}-${workoutId}-${exId}-n`;
    update({ ...data, notes: { ...(data.notes || {}), [key]: val } });
  };
  const getWeight = (exId, setIdx) => data.weights?.[`${activeDay}-${workoutId}-${exId}-w${setIdx}`] || "";
  const getNote = (exId) => data.notes?.[`${activeDay}-${workoutId}-${exId}-n`] || "";
  const getRPE = (exId, setIdx) => data.rpe?.[`${activeDay}-${workoutId}-${exId}-r${setIdx}`] || null;
  const setRPE = (exId, setIdx, val) => {
    const key = `${activeDay}-${workoutId}-${exId}-r${setIdx}`;
    update({ ...data, rpe: { ...(data.rpe || {}), [key]: val } });
  };
  const isSetDone = (exId, si) => !!data.logs?.[`${activeDay}-${workoutId}-${exId}-s${si}`];
  const getExDone = (exId, sets) => { let d=0; for(let i=0;i<sets;i++) if(isSetDone(exId,i)) d++; return d; };

  const getDayProgress = () => {
    let done = 0, total = 0;
    currentWorkout.sections.forEach(s => s.exercises.forEach(ex => {
      for (let i = 0; i < ex.sets; i++) { total++; if (isSetDone(ex.id, i)) done++; }
    }));
    return { done, total };
  };

  // Volume helpers
  const calcExVolume = (exSets) => {
    if (!exSets) return 0;
    return exSets.reduce((sum, s) => {
      const w = parseFloat(s.weight) || 0;
      return sum + (s.done ? w : 0);
    }, 0);
  };

  const calcTotalVolume = (exercises) => exercises?.reduce((sum, ex) => sum + calcExVolume(ex.sets), 0) || 0;

  const getLastSession = (workoutLabel) => {
    return (data.history || []).find(h => h.label === workoutLabel);
  };

  const getLiveExVolume = (ex) => {
    let total = 0;
    for (let i = 0; i < ex.sets; i++) {
      const w = parseFloat(getWeight(ex.id, i)) || 0;
      if (isSetDone(ex.id, i)) total += w;
    }
    return total;
  };

  const getLiveTotalVolume = () => {
    let total = 0;
    currentWorkout.sections.forEach(s => s.exercises.forEach(ex => { total += getLiveExVolume(ex); }));
    return total;
  };

  const VolumeTag = ({ current, previous, color }) => {
    if (!current && !previous) return null;
    const diff = current - (previous || 0);
    const pctChange = previous ? Math.round((diff / previous) * 100) : null;
    const isUp = diff > 0;
    const isDown = diff < 0;
    const isSame = diff === 0 && previous;
    return (
      <span style={{
        fontSize: 10, padding: "2px 7px", borderRadius: 4, fontWeight: 700, letterSpacing: 1,
        background: isUp ? "rgba(71,255,176,0.15)" : isDown ? "rgba(255,68,68,0.15)" : "rgba(255,255,255,0.05)",
        color: isUp ? "#47ffb0" : isDown ? "#ff6666" : "#888",
        border: `1px solid ${isUp ? "rgba(71,255,176,0.3)" : isDown ? "rgba(255,68,68,0.3)" : "#333"}`,
      }}>
        {isUp ? "▲" : isDown ? "▼" : "●"} {current} lbs
        {pctChange !== null && ` (${isUp ? "+" : ""}${pctChange}%)`}
      </span>
    );
  };

  const { done: totalDone, total: totalSets } = getDayProgress();
  const pct = totalSets > 0 ? Math.round((totalDone / totalSets) * 100) : 0;

  const checkPR = (exName, weight, isBodyweight) => {
    if (isBodyweight || !weight) return false;
    const allSessions = data.history || [];
    const prevBest = allSessions.reduce((best, session) => {
      const ex = session.exercises?.find(e => e.name === exName);
      const maxW = Math.max(...(ex?.sets||[]).map(s => parseFloat(s.weight)||0), 0);
      return Math.max(best, maxW);
    }, 0);
    return parseFloat(weight) > prevBest;
  };

  const completeWorkout = () => {
    const exercises = currentWorkout.sections.flatMap(s => s.exercises.map(ex => {
      const sets = Array.from({ length: ex.sets }, (_, i) => ({ setNum: i+1, weight: getWeight(ex.id, i), done: isSetDone(ex.id, i), rpe: getRPE(ex.id, i) }));
      const volume = sets.reduce((sum, s) => sum + (s.done ? (parseFloat(s.weight)||0) : 0), 0);
      const maxWeight = Math.max(...sets.filter(s=>s.done).map(s=>parseFloat(s.weight)||0), 0);
      const isPR = checkPR(ex.name, maxWeight, ex.bodyweight);
      return { name: ex.name, sets, setsCompleted: getExDone(ex.id, ex.sets), totalSets: ex.sets, volume, bodyweight: ex.bodyweight, isPR };
    }));
    const totalVolume = exercises.reduce((sum, ex) => sum + ex.volume, 0);
    const entry = {
      date: new Date().toLocaleDateString(), day: activeDay,
      label: currentWorkout.label, focus: currentWorkout.label,
      setsCompleted: totalDone, totalSets, totalVolume, exercises,
    };
    update({ ...data, history: [entry, ...(data.history||[])].slice(0, 40) });
    setTimerRunning(false);
    setShowComplete(true);
    setTimeout(() => setShowComplete(false), 2500);
  };

  const clearDay = () => {
    const logs = { ...(data.logs || {}) };
    currentWorkout.sections.forEach(s => s.exercises.forEach(ex => {
      for (let i = 0; i < ex.sets; i++) delete logs[`${activeDay}-${workoutId}-${ex.id}-s${i}`];
    }));
    update({ ...data, logs });
    setTimerRunning(false);
    setTimerKey(k => k + 1);
  };

  const handleSwapSave = (newEx, newCustomLib) => {
    if (!swapTarget) return;
    const { sectionIdx, exIdx } = swapTarget;
    const swaps = { ...(data.swaps || {}) };
    const key = `${workoutId}-${sectionIdx}-${exIdx}`;
    swaps[key] = newEx;
    const newData = { ...data, swaps };
    if (newCustomLib) newData.customLibrary = newCustomLib;
    update(newData);
    setSwapTarget(null);
  };

  const getExercise = (workoutId, sectionIdx, exIdx, baseEx) => {
    const key = `${workoutId}-${sectionIdx}-${exIdx}`;
    const swap = data.swaps?.[key];
    return swap ? { ...baseEx, name: swap.name, reps: swap.reps } : baseEx;
  };

  const resetSwap = (sectionIdx, exIdx) => {
    const key = `${workoutId}-${sectionIdx}-${exIdx}`;
    const swaps = { ...(data.swaps || {}) };
    delete swaps[key];
    update({ ...data, swaps });
  };

  const saveSchedule = (newSchedule) => {    update({ ...data, schedule: newSchedule });
    setShowScheduleEditor(false);
  };

  const color = currentWorkout.color;
  const isRestDay = workoutId === "rest";

  return (
    <div style={{ minHeight: "100vh", background: "#0a0a0a", color: "#f0f0f0", fontFamily: "'DM Sans', system-ui, sans-serif", paddingBottom: 80 }}>

      {showScheduleEditor && <ScheduleEditor schedule={schedule} onSave={saveSchedule} onClose={() => setShowScheduleEditor(false)} />}
      {swapTarget && <SwapExerciseModal exercise={swapTarget.exercise} color={color} customLibrary={data.customLibrary} onSave={handleSwapSave} onClose={() => setSwapTarget(null)} />}
      {showWarmUp && <WarmUpModal workoutId={workoutId} color={color} onClose={() => setShowWarmUp(false)} onStart={() => setShowWarmUp(false)} />}
      {showStats && <StatsDashboard data={data} history={history} onClose={() => setShowStats(false)} />}

      {/* Header */}
      <div style={{ background: "#111", borderBottom: "1px solid #1e1e1e", padding: "16px 16px 0" }}>
        <div style={{ maxWidth: 700, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16, flexWrap: "wrap", gap: 8 }}>
            <div>
              <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 34, letterSpacing: 3, color: "#e8ff47", lineHeight: 1 }}>THOMPSON GAINS</div>
              <div style={{ fontSize: 11, color: "#555", letterSpacing: 2, textTransform: "uppercase", marginTop: 2 }}>5-Day Tracker · Data saves locally</div>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => setShowStats(true)} style={{
                background: "#1a1a1a", border: "1px solid #2a2a2a", color: "#888",
                padding: "7px 12px", borderRadius: 6, cursor: "pointer", fontSize: 11,
                fontFamily: "inherit", fontWeight: 600, letterSpacing: 1,
              }}>📊 STATS</button>
              <button onClick={() => setShowScheduleEditor(true)} style={{
                background: "#1a1a1a", border: "1px solid #2a2a2a", color: "#888",
                padding: "7px 12px", borderRadius: 6, cursor: "pointer", fontSize: 11,
                fontFamily: "inherit", fontWeight: 600, letterSpacing: 1,
              }}>📅 SCHEDULE</button>
              <button onClick={() => setHistoryView(!historyView)} style={{
                background: historyView ? "#e8ff47" : "#1a1a1a", border: "1px solid #2a2a2a",
                color: historyView ? "#000" : "#888", padding: "7px 12px", borderRadius: 6,
                cursor: "pointer", fontSize: 11, fontFamily: "inherit", fontWeight: 600, letterSpacing: 1,
              }}>{historyView ? "← BACK" : "HISTORY"}</button>
            </div>
          </div>

          {/* Day Tabs */}
          {!historyView && (
            <div style={{ display: "flex", gap: 2, overflowX: "auto", paddingBottom: 0 }}>
              {WEEKDAYS.map(day => {
                const wid = schedule[day] || "rest";
                const wo = WORKOUTS.find(w => w.id === wid) || WORKOUTS[5];
                const isActive = activeDay === day;
                const isToday = WEEKDAYS[new Date().getDay()] === day;
                return (
                  <button key={day} className="day-tab" onClick={() => setActiveDay(day)} style={{
                    background: isActive ? wo.color : "transparent",
                    border: `2px solid ${isActive ? wo.color : isToday ? "#444" : "#222"}`,
                    color: isActive ? "#000" : isToday ? "#ccc" : "#666",
                    padding: "8px 10px", borderRadius: "6px 6px 0 0",
                    cursor: "pointer", fontFamily: "'Bebas Neue', sans-serif",
                    fontSize: 13, letterSpacing: 1, whiteSpace: "nowrap", transition: "all 0.15s",
                    position: "relative",
                  }}>
                    {day.slice(0,3).toUpperCase()}
                    {isToday && !isActive && (
                      <span style={{ position: "absolute", top: -5, right: -5, width: 8, height: 8, background: "#e8ff47", borderRadius: "50%" }}/>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* History View */}
      {historyView ? (
        <div style={{ maxWidth: 700, margin: "24px auto", padding: "0 16px", animation: "fadeIn 0.3s ease" }}>
          <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 28, color: "#e8ff47", letterSpacing: 2, marginBottom: 16 }}>WORKOUT HISTORY</div>
          {history.length === 0 ? (
            <div style={{ textAlign: "center", color: "#444", padding: 48, fontSize: 14 }}>No workouts logged yet. Complete a session!</div>
          ) : history.map((entry, i) => {
            const wo = WORKOUTS.find(w => w.label === entry.label || w.id === entry.day) || WORKOUTS[0];
            const prevEntry = history.slice(i+1).find(h => h.label === entry.label);
            const volDiff = prevEntry ? entry.totalVolume - prevEntry.totalVolume : null;
            const volUp = volDiff > 0; const volDown = volDiff < 0;
            return (
              <div key={i} style={{ background: "#141414", border: "1px solid #222", borderRadius: 10, padding: 18, marginBottom: 12, borderLeft: `4px solid ${wo.color}`, animation: "fadeIn 0.3s ease" }}>
                <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                  <div>
                    <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 18, color: wo.color, letterSpacing: 1 }}>{entry.day} — {entry.label}</div>
                    <div style={{ fontSize: 12, color: "#555", marginTop: 2 }}>{entry.date}</div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
                    <div style={{ background: "rgba(232,255,71,0.1)", border: "1px solid rgba(232,255,71,0.2)", padding: "4px 10px", borderRadius: 4, fontSize: 12, color: "#e8ff47", fontWeight: 600 }}>
                      {entry.setsCompleted}/{entry.totalSets} sets
                    </div>
                    {entry.totalVolume > 0 && (
                      <div style={{
                        padding: "4px 10px", borderRadius: 4, fontSize: 12, fontWeight: 700,
                        background: volUp ? "rgba(71,255,176,0.1)" : volDown ? "rgba(255,68,68,0.1)" : "rgba(255,255,255,0.05)",
                        color: volUp ? "#47ffb0" : volDown ? "#ff6666" : "#888",
                        border: `1px solid ${volUp ? "rgba(71,255,176,0.3)" : volDown ? "rgba(255,68,68,0.3)" : "#333"}`,
                      }}>
                        {volUp ? "▲" : volDown ? "▼" : "●"} {entry.totalVolume?.toLocaleString()} lbs
                        {volDiff !== null && ` (${volUp ? "+" : ""}${volDiff.toLocaleString()})`}
                      </div>
                    )}
                  </div>
                </div>
                <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
                  {entry.exercises?.filter(ex => ex.setsCompleted > 0).map((ex, j) => {
                    const prevEx = prevEntry?.exercises?.find(e => e.name === ex.name);
                    const exVolDiff = prevEx ? ex.volume - prevEx.volume : null;
                    const exUp = exVolDiff > 0; const exDown = exVolDiff < 0;
                    return (
                      <div key={j}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13, color: "#888", flexWrap: "wrap", gap: 6 }}>
                          <span style={{ color: "#bbb" }}>{ex.name} {ex.isPR && <span style={{ fontSize:10 }}>🏆</span>}</span>
                          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                            <span style={{ fontSize: 12, color: "#555" }}>{ex.setsCompleted}/{ex.totalSets} sets</span>
                            {ex.volume > 0 && (
                              <span style={{
                                fontSize: 11, padding: "2px 8px", borderRadius: 4, fontWeight: 700,
                                background: exUp ? "rgba(71,255,176,0.12)" : exDown ? "rgba(255,68,68,0.12)" : "rgba(255,255,255,0.05)",
                                color: exUp ? "#47ffb0" : exDown ? "#ff6666" : "#888",
                                border: `1px solid ${exUp ? "rgba(71,255,176,0.25)" : exDown ? "rgba(255,68,68,0.25)" : "#333"}`,
                              }}>
                                {exUp ? "▲" : exDown ? "▼" : "●"} {ex.volume} {ex.bodyweight ? "reps" : "lbs"}
                                {exVolDiff !== null && <span style={{ opacity: 0.7 }}> ({exUp ? "+" : ""}{exVolDiff})</span>}
                              </span>
                            )}
                          </div>
                        </div>
                        {ex.sets && (
                          <div style={{ display: "flex", gap: 5, flexWrap: "wrap", marginTop: 4 }}>
                            {ex.sets.filter(s => s.weight).map((s, k) => (
                              <span key={k} style={{ fontSize: 10, background: `${wo.color}12`, color: wo.color, border: `1px solid ${wo.color}25`, padding: "1px 7px", borderRadius: 4 }}>
                                S{s.setNum}: {s.weight} {ex.bodyweight ? "reps" : "lbs"}{s.rpe ? ` · RPE ${s.rpe}` : ""}
                              </span>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div style={{ maxWidth: 700, margin: "0 auto", padding: "16px 16px", animation: "fadeIn 0.3s ease" }}>

          {isRestDay ? (
            <div style={{ textAlign: "center", padding: "60px 20px" }}>
              <div style={{ fontSize: 60, marginBottom: 16 }}>😴</div>
              <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 36, color: "#444", letterSpacing: 3 }}>REST DAY</div>
              <div style={{ fontSize: 14, color: "#555", marginTop: 8 }}>Recovery is part of the gains. Enjoy it.</div>
              <button onClick={() => setShowScheduleEditor(true)} style={{ marginTop: 24, padding: "10px 24px", borderRadius: 8, background: "transparent", border: "1px solid #2a2a2a", color: "#666", fontFamily: "inherit", fontSize: 13, cursor: "pointer" }}>
                Change this day's workout →
              </button>
            </div>
          ) : (
            <>
              {/* Day Header Card */}
              <div style={{ background: "#141414", border: "1px solid #222", borderRadius: 12, padding: 18, marginBottom: 14, borderTop: `3px solid ${color}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
                  <div>
                    <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 26, color, letterSpacing: 2, lineHeight: 1 }}>{activeDay} — {currentWorkout.label}</div>
                    <div style={{ fontSize: 13, color: "#666", marginTop: 3 }}>{currentWorkout.subtitle}</div>
                    <div style={{ display: "inline-block", fontSize: 11, padding: "3px 10px", borderRadius: 4, marginTop: 8, background: `${currentWorkout.equipColor}18`, color: currentWorkout.equipColor, border: `1px solid ${currentWorkout.equipColor}44`, fontWeight: 600, letterSpacing: 1 }}>
                      {currentWorkout.equipment}
                    </div>
                    <button onClick={() => setShowWarmUp(true)} style={{ display:"block", marginTop:8, fontSize:11, padding:"4px 12px", borderRadius:4, background:"rgba(255,107,53,0.12)", border:"1px solid rgba(255,107,53,0.3)", color:"#ff6b35", cursor:"pointer", fontFamily:"inherit", fontWeight:600, letterSpacing:1 }}>
                      🔥 WARM UP
                    </button>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 38, color: pct === 100 ? "#47ffb0" : color, lineHeight: 1 }}>{pct}%</div>
                    <div style={{ fontSize: 11, color: "#555", marginTop: 2 }}>{totalDone} / {totalSets} SETS</div>
                    {(() => {
                      const liveVol = getLiveTotalVolume();
                      const lastSession = getLastSession(currentWorkout.label);
                      const lastVol = lastSession?.totalVolume || 0;
                      if (!liveVol && !lastVol) return null;
                      const diff = liveVol - lastVol;
                      const isUp = diff > 0; const isDown = diff < 0;
                      return (
                        <div style={{ marginTop: 6, fontSize: 11, color: isUp ? "#47ffb0" : isDown ? "#ff6666" : "#888", fontWeight: 700 }}>
                          {isUp ? "▲" : isDown ? "▼" : "●"} {liveVol.toLocaleString()} lbs total
                          {lastVol > 0 && <div style={{ fontSize: 10, color: "#555", fontWeight: 400 }}>Last: {lastVol.toLocaleString()} lbs</div>}
                        </div>
                      );
                    })()}
                  </div>
                </div>

                {/* Workout Timer */}
                <div style={{ marginTop: 14, paddingTop: 14, borderTop: "1px solid #1e1e1e" }}>
                  <div style={{ fontSize: 10, color: "#555", textTransform: "uppercase", letterSpacing: 2, marginBottom: 8 }}>WORKOUT TIMER</div>
                  <WorkoutTimer key={timerKey} color={color} isRunning={timerRunning} onToggle={() => setTimerRunning(r => !r)} onReset={() => { setTimerRunning(false); setTimerKey(k => k+1); }} />
                </div>

                {/* Progress Bar */}
                <div style={{ marginTop: 14, background: "#1e1e1e", height: 5, borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ height: "100%", borderRadius: 3, background: pct === 100 ? "#47ffb0" : color, width: `${pct}%`, transition: "width 0.4s ease" }} />
                </div>

                <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                  <button onClick={completeWorkout} style={{
                    flex: 1, padding: "10px 0", borderRadius: 8,
                    background: pct === 100 ? "#47ffb0" : `${color}22`,
                    border: `1px solid ${pct === 100 ? "#47ffb0" : color}`,
                    color: pct === 100 ? "#000" : color,
                    fontFamily: "inherit", fontWeight: 600, fontSize: 13, cursor: "pointer", letterSpacing: 1,
                    animation: showComplete ? "pop 0.3s ease" : "none",
                  }}>
                    {showComplete ? "✓ LOGGED!" : pct === 100 ? "✅ COMPLETE WORKOUT" : "LOG WORKOUT"}
                  </button>
                  <button onClick={clearDay} style={{ padding: "10px 14px", borderRadius: 8, background: "transparent", border: "1px solid #2a2a2a", color: "#555", fontFamily: "inherit", fontSize: 12, cursor: "pointer" }}>RESET</button>
                </div>
              </div>

              {/* Rest Timer */}
              <RestTimer color={color} />

              {/* Exercise Sections */}
              {currentWorkout.sections.map((section, si) => (
                <div key={si} style={{ background: section.isFinisher ? "rgba(232,255,71,0.03)" : "#141414", border: section.isFinisher ? "1px solid rgba(232,255,71,0.15)" : "1px solid #1e1e1e", borderRadius: 10, marginBottom: 10, overflow: "hidden" }}>
                  <div style={{ padding: "11px 16px", borderBottom: "1px solid #1a1a1a", fontSize: 11, textTransform: "uppercase", letterSpacing: 2, fontWeight: 600, color: section.isFinisher ? "#e8ff47" : "#555" }}>
                    {section.title}
                  </div>
                  {section.exercises.map((baseEx, ei) => {
                    const ex = getExercise(workoutId, si, ei, baseEx);
                    const isSwapped = !!(data.swaps?.[`${workoutId}-${si}-${ei}`]);
                    const exDone = getExDone(ex.id, ex.sets);
                    const allDone = exDone === ex.sets;
                    return (
                      <div key={ei} className="ex-row" style={{ padding: "13px 16px", borderBottom: ei < section.exercises.length - 1 ? "1px solid #1a1a1a" : "none", background: allDone ? `${color}08` : "transparent", transition: "background 0.15s" }}>
                        <div style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 8 }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 14, fontWeight: 500, color: allDone ? color : "#e0e0e0", display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                              {ex.name}
                              {ex.kneeSafe && <span style={{ fontSize: 9, background: "rgba(71,255,176,0.12)", color: "#47ffb0", border: "1px solid rgba(71,255,176,0.3)", padding: "1px 6px", borderRadius: 3, letterSpacing: 1, fontWeight: 700 }}>KNEE SAFE</span>}
                              {isSwapped && <span style={{ fontSize: 9, background: "rgba(232,255,71,0.12)", color: "#e8ff47", border: "1px solid rgba(232,255,71,0.3)", padding: "1px 6px", borderRadius: 3, letterSpacing: 1, fontWeight: 700 }}>SWAPPED</span>}
                              {(() => {
                                const liveVol = getLiveExVolume(ex);
                                const lastSession = getLastSession(currentWorkout.label);
                                const lastEx = lastSession?.exercises?.find(e => e.name === ex.name);
                                const lastVol = lastEx?.volume || 0;
                                const maxLiveWeight = (() => { let m=0; for(let i=0;i<ex.sets;i++){const w=parseFloat(getWeight(ex.id,i))||0; if(isSetDone(ex.id,i)&&w>m)m=w;} return m; })();
                                const isPR = !ex.bodyweight && checkPR(ex.name, maxLiveWeight, false) && maxLiveWeight > 0;
                                return (<>
                                  {isPR && <span style={{ fontSize:10, background:"rgba(232,200,0,0.15)", color:"#ffd700", border:"1px solid rgba(232,200,0,0.4)", padding:"1px 6px", borderRadius:3, letterSpacing:1, fontWeight:700 }}>🏆 PR</span>}
                                  {liveVol > 0 && <VolumeTag current={liveVol} previous={lastVol} color={color} />}
                                </>);
                              })()}
                            </div>
                            <div style={{ fontSize: 12, color: "#555", marginTop: 2 }}>{ex.sets} sets × {ex.reps} · {exDone}/{ex.sets} done</div>
                          </div>
                          <div style={{ display: "flex", flexDirection: "column", gap: 4, alignItems: "flex-end" }}>
                            <div style={{ display: "flex", gap: 4 }}>
                              <button onClick={() => setSwapTarget({ sectionIdx: si, exIdx: ei, exercise: ex })} style={{
                                padding: "3px 8px", borderRadius: 4, background: "transparent",
                                border: `1px solid ${color}55`, color: color, fontSize: 10,
                                cursor: "pointer", fontFamily: "inherit", fontWeight: 600, letterSpacing: 1,
                              }}>⇄ SWAP</button>
                              {isSwapped && (
                                <button onClick={() => resetSwap(si, ei)} style={{
                                  padding: "3px 8px", borderRadius: 4, background: "transparent",
                                  border: "1px solid #333", color: "#555", fontSize: 10,
                                  cursor: "pointer", fontFamily: "inherit", letterSpacing: 1,
                                }}>↺ RESET</button>
                              )}
                            </div>
                          </div>
                        </div>

                        {/* Per-Set rows */}
                        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
                          {Array.from({ length: ex.sets }).map((_, si2) => {
                            const done = isSetDone(ex.id, si2);
                            const isBodyweight = ex.bodyweight;
                            const rpe = getRPE(ex.id, si2);
                            const rpeColor = rpe >= 9 ? "#ff4444" : rpe >= 7 ? "#ff6b35" : rpe >= 5 ? "#e8ff47" : "#47ffb0";
                            return (
                              <div key={si2} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                  <SetButton checked={done} onClick={() => toggleSet(ex.id, si2)} color={color} />
                                  <span style={{ fontSize: 11, color: done ? color : "#555", fontWeight: 600, minWidth: 40 }}>SET {si2 + 1}</span>
                                  <div style={{ display: "flex", alignItems: "center", gap: 4, flex: 1 }}>
                                    <input
                                      type="number"
                                      value={getWeight(ex.id, si2)}
                                      onChange={e => setWeight(ex.id, si2, e.target.value)}
                                      placeholder={isBodyweight ? "reps" : "lbs"}
                                      style={{
                                        width: 64, padding: "5px 8px",
                                        background: done ? `${color}12` : "#1a1a1a",
                                        border: `1px solid ${done ? color + "55" : "#2a2a2a"}`,
                                        borderRadius: 6, color: done ? color : "#fff",
                                        fontSize: 13, fontFamily: "inherit", outline: "none", textAlign: "center",
                                        transition: "all 0.2s",
                                      }}
                                      onFocus={e => e.target.style.borderColor = color}
                                      onBlur={e => e.target.style.borderColor = done ? color + "55" : "#2a2a2a"}
                                    />
                                    <span style={{ fontSize: 11, color: "#444" }}>
                                      {isBodyweight ? "reps" : "lbs"}
                                    </span>
                                    {si2 > 0 && getWeight(ex.id, si2 - 1) && !getWeight(ex.id, si2) && (
                                      <button onClick={() => setWeight(ex.id, si2, getWeight(ex.id, si2 - 1))} style={{
                                        fontSize: 10, padding: "3px 8px", borderRadius: 4, background: "transparent",
                                        border: `1px solid #2a2a2a`, color: "#555", cursor: "pointer", fontFamily: "inherit",
                                      }}>= prev</button>
                                    )}
                                  </div>
                                </div>
                                {/* RPE selector — shows after set is checked */}
                                {done && (
                                  <div style={{ display: "flex", alignItems: "center", gap: 4, paddingLeft: 42 }}>
                                    <span style={{ fontSize: 10, color: "#444", marginRight: 2, letterSpacing: 1 }}>RPE:</span>
                                    {[6,7,8,9,10].map(r => {
                                      const rc = r >= 9 ? "#ff4444" : r >= 7 ? "#ff6b35" : "#e8ff47";
                                      const isSelected = rpe === r;
                                      return (
                                        <button key={r} onClick={() => setRPE(ex.id, si2, isSelected ? null : r)} style={{
                                          width: 28, height: 24, borderRadius: 4, cursor: "pointer",
                                          border: `1px solid ${isSelected ? rc : "#2a2a2a"}`,
                                          background: isSelected ? `${rc}22` : "transparent",
                                          color: isSelected ? rc : "#555",
                                          fontSize: 11, fontWeight: isSelected ? 700 : 400,
                                          fontFamily: "inherit", transition: "all 0.1s",
                                        }}>{r}</button>
                                      );
                                    })}
                                    {rpe && (
                                      <span style={{ fontSize: 10, color: rpeColor, fontWeight: 700, marginLeft: 4 }}>
                                        {rpe === 10 ? "MAX 🔥" : rpe === 9 ? "Near failure" : rpe === 8 ? "2 left" : rpe === 7 ? "3 left" : "Easy"}
                                      </span>
                                    )}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                        <input value={getNote(ex.id)} onChange={e => setNote(ex.id, e.target.value)}
                          placeholder="Note (e.g. felt strong, go heavier next week)..."
                          style={{ width: "100%", background: "#0f0f0f", border: "1px solid #222", borderRadius: 6, padding: "6px 10px", color: "#888", fontSize: 12, fontFamily: "inherit", outline: "none" }}
                          onFocus={e => e.target.style.borderColor = color}
                          onBlur={e => e.target.style.borderColor = "#222"}
                        />
                      </div>
                    );
                  })}
                </div>
              ))}

              {/* Sauna Reminder */}
              <div style={{ background: "linear-gradient(135deg, rgba(255,107,53,0.08), rgba(255,107,53,0.03))", border: "1px solid rgba(255,107,53,0.2)", borderRadius: 10, padding: 14, display: "flex", alignItems: "center", gap: 12 }}>
                <span style={{ fontSize: 26 }}>🔥</span>
                <div>
                  <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 16, color: "#ff6b35", letterSpacing: 2 }}>15 MIN SAUNA AFTER</div>
                  <div style={{ fontSize: 12, color: "#555", marginTop: 2 }}>Drink 16oz water first · Reduces knee inflammation · Boosts recovery</div>
                </div>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
